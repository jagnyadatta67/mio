<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Added Mio Store -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiO Store – Coming Soon</title>

  <!-- Open Graph -->
  <meta property="og:title" content="🌱 MiO Store" />
  <meta property="og:description" content="🚀 Preorders are now open for our millets & special recipes. Be the first to shop online at themiostore.com!" />
  <meta property="og:image" content="https://www.themiostore.com/images/1.jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://www.themiostore.com/" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://www.themiostore.com/" />
  <meta name="keywords" content="MiO Store, buy millets online, organic food, healthy grains, ecommerce India" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="🌱 MiO Store" />
  <meta name="twitter:description" content="🚀 Preorders are now open for our millets & special recipes." />
  <meta name="twitter:image" content="https://www.themiostore.com/images/1.jpeg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/favicon.png" />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <!-- Hero Section -->
  <section class="container" aria-label="Featured MiO Millets">
    <div class="carousel">
      <div class="carousel-track">
        <div class="carousel-slide">
          <img src="images/1.jpeg" alt="Foxtail Millet pack" />
        </div>
        <div class="carousel-slide">
          <img src="images/2.jpeg" alt="Featured Millet pack" />
        </div>
      </div>
      <button class="carousel-btn prev">&#10094;</button>
      <button class="carousel-btn next">&#10095;</button>
      <div class="carousel-dots"></div>
    </div>
  </section>

  <!-- Note Section -->
  <div class="note-section">
    <p>🌱 E-commerce site launching soon! Preorders now open.</p>
  </div>

  <!-- WhatsApp Button -->
  <div class="wa-button-wrap">
    <a href="https://wa.me/919938182723?text=Hi%20I%20want%20to%20place%20an%20order" 
       target="_blank" 
       class="wa-button">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
      Order Now
    </a>
  </div>

  <!-- Products -->
  <section class="container" id="shop">
    <h2 class="section-title">Our Products</h2>
    <div class="grid">
      <article class="card">
        <div class="card-img"><img src="images/prod-foxtail.png" alt="Foxtail Millet" /></div>
        <div class="card-body"><div class="card-title">Foxtail Millet</div></div>
      </article>

      <article class="card">
        <div class="card-img"><img src="images/prod-little.png" alt="Little Millet" /></div>
        <div class="card-body"><div class="card-title">Little Millet</div></div>
      </article>

      <article class="card">
        <div class="card-img"><img src="images/prod-finger.png" alt="Finger Millet" /></div>
        <div class="card-body"><div class="card-title">Finger Millet</div></div>
      </article>
    </div>
  </section>
  <script src="script.js"></script>
  <script src="include.js"></script>
</body>
</html>
